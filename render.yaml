services:
  # FastAPI conversion engine.
  # Runs from a container rather than the native Python runtime because OCR
  # needs the Tesseract binary, which only apt can install. The Python version
  # is pinned by the Dockerfile's base image, not by PYTHON_VERSION.
  - type: web
    name: openconverter-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Set to the deployed frontend URL once it exists (see DEPLOY.md).
      - key: ALLOWED_ORIGINS
        sync: false

  # Next.js frontend, exported to static files
  - type: web
    name: openconverter-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked in at build time — changing it requires a redeploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false
